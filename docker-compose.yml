# Docker keeps container logs forever by default. Three files of 10 MB per container is plenty.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  print-portal:
    build: .
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      # The address people open. adapter-node otherwise assumes https and refuses uploads as cross-site.
      # docker-compose.https.yml replaces it with the https address.
      ORIGIN: "http://${LAN_IP}:${PORTAL_PORT:-80}"
    # Bind to the LAN address only, so the portal is not reachable from other interfaces.
    ports:
      - "${LAN_IP:-127.0.0.1}:${PORTAL_PORT:-80}:3000"
    volumes:
      - data:/data
volumes:
  data:
