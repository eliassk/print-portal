# HTTPS in front of the portal. Use together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
#
# Caddy gets its own LAN address (ipvlan), so it owns ports 80 and 443 there even when the
# VM's own ports are taken (e.g. another app already holds 0.0.0.0:80 and :443).
services:
  print-portal:
    # Only Caddy talks to the app; the plain HTTP port is closed.
    ports: !reset []
    environment:
      # SvelteKit checks form posts against this origin; it MUST match the address people open.
      ORIGIN: "https://${PORTAL_DOMAIN}"
      # Caddy adds the client to X-Forwarded-For. Customer networks match on that address.
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: "1"
  caddy:
    build: ./caddy
    restart: unless-stopped
    depends_on: [print-portal]
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN}
      CF_API_TOKEN: ${CF_API_TOKEN}
      ACME_EMAIL: ${ACME_EMAIL}
    networks:
      lan:
        ipv4_address: ${CADDY_IP}
      default: {}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
networks:
  lan:
    driver: ipvlan
    driver_opts:
      parent: ${LAN_PARENT_IF}
      ipvlan_mode: l2
    ipam:
      config:
        - subnet: ${LAN_SUBNET}
          gateway: ${LAN_GATEWAY}
volumes:
  caddy-data:
  caddy-config:
